# Every feckless component at the same tag. The components require each
# other by name, so this is the one place the tag is written.
# 0030: v0.9.5, for gfx_draw_text_style() (feckless-libs' 9006, 9007):
# bold, heavy and italic, which 0031's markdown draws with. 0032: v0.9.6,
# for 9008 -- gaps kept open, heavy a font pixel wider, gfx_text_w_style().
# 0041: v0.9.7, for mailsend_with() (9009, 9010): the notes' .md and log
# attached. 0043: v0.9.8, for storage_list.h and feckless_chooser (9011,
# 9012): file mode's chooser.
dependencies:
  idf:
    version: ">=6.1"

  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "v0.9.8"
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "v0.9.8"
  # Required by name by feckless_drivers, which links it whether or not
  # anything plays audio.
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "v0.9.8"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "v0.9.8"
  # Required by name by feckless_storage_handler: the Tab5-fixed MSC
  # driver, and FatFs patched for exFAT.
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "v0.9.8"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "v0.9.8"
  # The settings page: the email account and its form, the keyboard the
  # form links (unused here, osk off), NVS, and the library table.
  feckless_mail:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_mail
    version: "v0.9.8"
  # 0043: file mode's chooser, over storage_list.h.
  feckless_chooser:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_chooser
    version: "v0.9.8"
  feckless_keyboard:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_keyboard
    version: "v0.9.8"
  feckless_nvs_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_nvs_handler
    version: "v0.9.8"
  feckless_libversions:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_libversions
    version: "v0.9.8"
  # Wi-Fi through the C6 for sends, with the saved networks Avoidant
  # keeps. It brings esp_wifi_remote, esp_hosted, mDNS and the USB
  # Ethernet drivers from its own manifest; see its README for the
  # sdkconfig they need.
  feckless_network_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_network_handler
    version: "v0.9.8"
  # esp_hosted below 3.1.0, on top of the library's own ">=3.0.2". 3.1.0
  # (2026-11-05) fixes its SDIO RX staging buffers at 1536 bytes for a
  # co-processor that sends no SDIO_MODE TLV -- M5's C6 firmware sends
  # none -- and refuses any larger read ("SDIO RX read (5120 bytes)
  # exceeds staging target"). The host still runs in streaming mode and
  # M5's firmware still batches frames, so every TLS handshake lost its
  # certificate burst and no connection opened. 3.0.x sized the buffer to
  # the read. dependencies.lock is not committed, so without this each
  # fresh resolve takes the newest. Lift it when a release handles a
  # C6 that batches without saying so, or when feckless_network_handler
  # caps it itself.
  espressif/esp_hosted: ">=3.0.7,<3.1.0"
