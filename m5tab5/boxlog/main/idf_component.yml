dependencies:
  idf:
    version: ">=6.1"

  # u-jinxed-0005: feckless-libs' umode branch, as the writer's manifest on
  # this branch names it (u-jinxed-0002); this project's own
  # dependencies.lock records the commit. Not the writer's manifest
  # (../../main/idf_component.yml).
  #
  # What both builds of main need: feckless_umode and feckless_box_calls,
  # the .bin's side, the box; feckless_abi, which feckless_box_calls
  # requires and the ELF builds with; the drivers and the storage handler,
  # which bring the card up and are the ELF's headers; graphics, fatfs and
  # the two USB class drivers because those components require them by
  # name.
  #
  # u-jinxed-0007: not feckless_box_libc or feckless_abi_storage. The
  # component manager makes every dependency here a requirement of main,
  # in both builds, so the .bin linked feckless_box_libc -- an app's libc
  # -- beside IDF's, and stdin, strerror, fputc and the rest were defined
  # twice. They are elf/jinxed_boxlog_elfdeps' dependencies, which only elf/
  # builds.
  feckless_abi:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi
    version: "umode"
  feckless_umode:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_umode
    version: "umode"
  feckless_box_calls:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_box_calls
    version: "umode"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "umode"
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "umode"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "umode"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "umode"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "umode"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "umode"
